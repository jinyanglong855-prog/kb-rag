[project]
name = "kb-rag"
version = "0.4.0"
description = "本地知识库检索：从朴素 RAG 到 Agentic GraphRAG 的六阶段演进（作品集项目）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastembed>=0.7",
    "mcp>=1.9",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "openai>=1.60",
    "networkx>=3.4",
    "pyvis>=0.3",
    "bm25s>=0.3.11",
    "jieba>=0.42.1",
    "chromadb>=1.5.9",
    "docling>=2.137.0",
    "lightrag-hku>=1.5.7",
]

[project.scripts]
kb-rag = "kb_rag.__main__:main"
kb-rag-mcp = "kb_rag.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11,<1.0"]
build-backend = "uv_build"
