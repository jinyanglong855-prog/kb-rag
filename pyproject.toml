[project]
name = "kb-rag"
version = "0.1.0"
description = "本地知识库检索：从朴素 RAG 到 Agentic GraphRAG 的六阶段演进（作品集项目）"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.7",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "openai>=1.60",
    "networkx>=3.4",
    "pyvis>=0.3",
]

[project.scripts]
kb-rag = "kb_rag.__main__:main"

[build-system]
requires = ["uv_build>=0.11,<1.0"]
build-backend = "uv_build"
